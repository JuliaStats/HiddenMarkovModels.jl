name: Run benchmarks

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

# Only trigger the benchmark job when you add `run benchmark` label to the PR
jobs:
  Benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: contains(github.event.pull_request.labels.*.name, 'run benchmark')
    env:
      JULIA_NUM_THREADS: auto
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2

      - name: Install AirspeedVelocity
        run: |
          julia -e 'using Pkg; Pkg.add(name="AirspeedVelocity", version="0.6"); Pkg.build("AirspeedVelocity")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"

      - name: Run benchmarks
        run: |
          mkdir -p results
          benchpkg HiddenMarkovModels \
            --rev=${{ github.event.repository.default_branch }},${{ github.event.pull_request.head.sha }} \
            --bench-on=${{ github.event.pull_request.head.sha }} \
            --output-dir=results/ \
            --tune

      - name: Build markdown comparison table
        run: |
          benchpkgtable HiddenMarkovModels \
            --rev=${{ github.event.repository.default_branch }},${{ github.event.pull_request.head.sha }} \
            --input-dir=results/ > table.md
          printf '### Benchmark Results\n\nBaseline `%s` vs target `%s` (estimator = median, ratios from `benchpkgtable`).\n\n' \
            "${{ github.event.repository.default_branch }}" \
            "${{ github.event.pull_request.head.sha }}" > body.md
          cat table.md >> body.md

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/

      - name: Find existing benchmark comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Benchmark Results"

      - name: Post benchmark comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: body.md
          edit-mode: replace
